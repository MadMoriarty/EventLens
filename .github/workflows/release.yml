name: Manually create draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.0)
        required: true
        type: string
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: ./tools/build.ps1
        shell: pwsh
      - name: Create draft with portable artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Use a semantic version tag' }
          gh release create $env:RELEASE_TAG artifacts/EventLens-win-x64.zip --draft --title "EventLens $env:RELEASE_TAG" --notes-file CHANGELOG.md
